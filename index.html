<!doctype html><html><head>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Diza Imagine</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px 60px}.brand{font-weight:750;font-size:20px;letter-spacing:-.4px;margin-bottom:28px}.panel{border:1px solid #242424;background:#0d0d0d;border-radius:18px;padding:16px}.drop{height:290px;border:1px dashed #383838;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:#111;cursor:pointer}.drop img{width:100%;height:100%;object-fit:contain}.muted{color:#888;font-size:13px}textarea,input[type=password]{width:100%;margin-top:14px;background:#111;border:1px solid #2b2b2b;border-radius:14px;color:#fff;padding:14px;font:inherit;outline:none}textarea{min-height:120px;resize:vertical}button{width:100%;height:52px;border:0;border-radius:14px;margin-top:12px;background:#fff;color:#050505;font-weight:750;font-size:15px;cursor:pointer}button.secondary{background:#181818;color:#fff;border:1px solid #333}button:disabled{opacity:.45}.status{min-height:22px;margin:14px 2px 0;color:#aaa;font-size:13px;white-space:pre-line}.progress{height:6px;background:#1d1d1d;border-radius:99px;overflow:hidden;margin-top:10px;display:none}.progress>i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .35s ease}.progress.on{display:block}.result{margin-top:16px}.result video{width:100%;border-radius:14px;background:#000;max-height:70vh}.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}.pill{font-size:11px;color:#aaa;border:1px solid #292929;border-radius:99px;padding:5px 8px}.link{color:#bbb;text-decoration:none;font-size:12px}.cfg{margin-top:10px;color:#777;font-size:12px}.ok{color:#a8e6b0}.warn{color:#e8c486}
</style></head><body><main><div class="brand">DIZA IMAGINE <span class="pill">HUNYUAN 1.5 · STEP-DISTILLED · 5s</span></div><div class="panel">
<label class="drop" id="drop"><span id="hint"><b>Upload image</b><br><span class="muted">JPG / PNG / WEBP</span></span><img id="preview" hidden></label><input id="file" type="file" accept="image/*" hidden>
<textarea id="prompt" placeholder="Describe the motion..."></textarea>
<input id="token" type="password" autocomplete="off" placeholder="HF write token (dipakai lokal di browser)">
<div class="row"><span class="muted">Token hanya disimpan di session browser ini.</span><a class="link" target="_blank" rel="noopener" href="https://huggingface.co/settings/tokens">HF token ↗</a></div>
<div class="cfg"><b>BUILD 5S-ZG-v1</b> · 121 frames · 24 fps · 4 steps · raw prompt · ZeroGPU</div>
<button class="secondary" id="setup">Setup / check free 5s backend</button>
<div class="status" id="backend">Backend belum diset.</div>
<button id="go">Generate real 5s video</button><div class="progress" id="progress"><i id="bar"></i></div><div class="status" id="status"></div><div class="result" id="result"></div>
</div></main><script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
import { createRepo, uploadFiles } from "https://cdn.jsdelivr.net/npm/@huggingface/hub/+esm";

const BUILD="5S-ZG-v1", TARGET_FRAMES=121, TARGET_FPS=24;
const file=document.querySelector('#file'),drop=document.querySelector('#drop'),preview=document.querySelector('#preview'),hint=document.querySelector('#hint'),go=document.querySelector('#go'),setup=document.querySelector('#setup'),token=document.querySelector('#token'),status=document.querySelector('#status'),backendEl=document.querySelector('#backend'),result=document.querySelector('#result'),progress=document.querySelector('#progress'),bar=document.querySelector('#bar');
token.value=sessionStorage.getItem('hf_token')||'';
let SPACE_ID=sessionStorage.getItem('diza_hf_space')||'';
const prog=(n,t)=>{progress.classList.add('on');bar.style.width=Math.max(0,Math.min(100,n))+'%';status.textContent=n+'% · '+t};
drop.onclick=()=>file.click();
file.onchange=()=>{if(!file.files[0])return;preview.src=URL.createObjectURL(file.files[0]);preview.hidden=false;hint.hidden=true};

async function hfFetch(path,hf,opts={}){
  const headers={...(opts.headers||{}),Authorization:'Bearer '+hf};
  return fetch('https://huggingface.co'+path,{...opts,headers});
}
async function getIdentity(hf){
  const r=await hfFetch('/api/whoami-v2',hf);
  if(!r.ok) throw Error('HF token invalid: '+(await r.text()).slice(0,180));
  return r.json();
}
async function getRuntime(hf,spaceId){
  const r=await hfFetch('/api/spaces/'+spaceId+'/runtime',hf);
  if(!r.ok) return null;
  return r.json();
}
async function setBackendState(hf,spaceId){
  const rt=await getRuntime(hf,spaceId);
  if(!rt){backendEl.textContent='Backend repo ada, runtime belum tersedia.';return false}
  const stage=rt.stage||'UNKNOWN', hw=rt.hardware?.current||rt.hardware?.requested||'unknown';
  backendEl.innerHTML='Backend: <b>'+spaceId+'</b><br>Stage: '+stage+' · hardware: '+hw;
  return stage==='RUNNING' && hw==='zero-a10g';
}
async function sourceBlob(path){
  const url='https://raw.githubusercontent.com/fatonyist92-jpg/Diza-Imagine-/main/hf_space/'+path+'?v='+Date.now();
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw Error('Gagal ambil '+path+' dari source repo');
  return new Blob([await r.text()],{type:'text/plain'});
}

setup.onclick=async()=>{
  const hf=token.value.trim();
  if(!hf){backendEl.textContent='Masukkan HF write token dulu.';return}
  sessionStorage.setItem('hf_token',hf);
  setup.disabled=true; go.disabled=true; backendEl.textContent='Checking Hugging Face account…';
  try{
    const me=await getIdentity(hf);
    const username=me.name||me.user||me.username;
    if(!username) throw Error('Username HF tidak terbaca');
    const spaceId=username+'/diza-hunyuan-5s';
    const repo={type:'space',name:spaceId};
    backendEl.textContent='Preparing '+spaceId+'…';
    const [readme,app,req]=await Promise.all([sourceBlob('README.md'),sourceBlob('app.py'),sourceBlob('requirements.txt')]);
    const files=[{path:'README.md',content:readme},{path:'app.py',content:app},{path:'requirements.txt',content:req}];

    let exists=false;
    const chk=await fetch('https://huggingface.co/api/spaces/'+spaceId,{headers:{Authorization:'Bearer '+hf}});
    exists=chk.ok;
    if(!exists){
      await createRepo({repo,accessToken:hf,sdk:'gradio',visibility:'public',files});
    }else{
      await uploadFiles({repo,accessToken:hf,files});
    }

    backendEl.textContent='Requesting free ZeroGPU…';
    const hw=await hfFetch('/api/spaces/'+spaceId+'/hardware',hf,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({flavor:'zero-a10g'})
    });
    if(!hw.ok){
      const t=(await hw.text()).slice(0,320);
      throw Error('ZeroGPU request ditolak: '+t);
    }
    SPACE_ID=spaceId; sessionStorage.setItem('diza_hf_space',spaceId);
    backendEl.innerHTML='<span class="ok">Backend dibuat ✓</span><br><b>'+spaceId+'</b><br>ZeroGPU sedang build/start. Tunggu sampai Stage RUNNING.';
    status.textContent='Setup selesai. Tekan check lagi beberapa saat sampai RUNNING.';
  }catch(e){
    const m=String(e.message||e);
    backendEl.innerHTML='<span class="warn">Setup belum selesai.</span><br>'+m.slice(0,520);
  }finally{setup.disabled=false;go.disabled=false}
};

go.onclick=async()=>{
  const p=document.querySelector('#prompt').value.trim(),hf=token.value.trim();
  if(!file.files[0]||!p){status.textContent='Upload image dan isi prompt dulu.';return}
  if(!hf){status.textContent='Masukkan HF token dulu.';return}
  sessionStorage.setItem('hf_token',hf);
  if(!SPACE_ID){
    try{const me=await getIdentity(hf);SPACE_ID=(me.name||me.user||me.username)+'/diza-hunyuan-5s'}catch{}
  }
  if(!SPACE_ID){status.textContent='Setup backend dulu.';return}
  const rt=await getRuntime(hf,SPACE_ID);
  const hw=rt?.hardware?.current||rt?.hardware?.requested;
  if(rt?.stage!=='RUNNING'||hw!=='zero-a10g'){
    backendEl.textContent='Backend belum RUNNING · stage '+(rt?.stage||'unknown')+' · '+(hw||'unknown');
    status.textContent='Tekan Setup / check sampai backend RUNNING.';
    return;
  }

  go.disabled=true;result.innerHTML='';prog(5,BUILD+' · connecting '+SPACE_ID);
  try{
    const app=await Client.connect(SPACE_ID,{token:hf});
    prog(18,'Sending raw prompt · 121 frames');
    const job=app.submit('/generate',{input_image:handle_file(file.files[0]),prompt:p,seed:-1});
    let data=null;
    for await(const msg of job){
      if(msg.type==='status'){
        const q=msg.position!=null?' · queue '+(msg.position+1):'';
        prog(35,'ZeroGPU generating'+q);
      }else if(msg.type==='data'){data=msg.data;prog(92,'Encoding MP4…');break}
    }
    if(!data) throw Error('Backend returned no result');
    let v=null;const walk=o=>{if(v)return;if(typeof o==='string'&&/\.(mp4|webm)(\?|$)/i.test(o))v=o;else if(o&&typeof o==='object'){if(o.url&&/\.(mp4|webm)(\?|$)/i.test(o.url))v=o.url;else Object.values(o).forEach(walk)}};walk(data);
    if(!v)throw Error('No MP4 URL returned');
    result.innerHTML='<video id="vid" controls autoplay loop playsinline src="'+v+'"></video><div class="row"><span class="muted" id="meta">Checking duration…</span><a class="pill" style="color:#fff;text-decoration:none" target="_blank" href="'+v+'">Open MP4</a></div>';
    const vid=document.querySelector('#vid'),meta=document.querySelector('#meta');
    await new Promise((resolve,reject)=>{vid.onloadedmetadata=resolve;vid.onerror=()=>reject(Error('Video metadata failed'))});
    const d=vid.duration;
    meta.textContent=TARGET_FRAMES+' frames · '+d.toFixed(2)+'s actual';
    if(!Number.isFinite(d)||d<4.5) throw Error('WRONG_DURATION '+d.toFixed(2)+'s');
    prog(100,'REAL '+d.toFixed(2)+' detik ✓');
  }catch(e){
    status.textContent='Generation failed: '+String(e.message||e).slice(0,520);
  }finally{go.disabled=false}
};

(async()=>{if(SPACE_ID&&token.value.trim()){try{await setBackendState(token.value.trim(),SPACE_ID)}catch{}}})();
</script></body></html>
