<!doctype html><html><head>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Diza Imagine</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px 60px}.brand{font-weight:750;font-size:20px;letter-spacing:-.4px;margin-bottom:28px}.panel{border:1px solid #242424;background:#0d0d0d;border-radius:18px;padding:16px}.drop{height:290px;border:1px dashed #383838;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:#111;cursor:pointer}.drop img{width:100%;height:100%;object-fit:contain}.muted{color:#888;font-size:13px}textarea,input[type=password]{width:100%;margin-top:14px;background:#111;border:1px solid #2b2b2b;border-radius:14px;color:#fff;padding:14px;font:inherit;outline:none}textarea{min-height:120px;resize:vertical}button{width:100%;height:52px;border:0;border-radius:14px;margin-top:12px;background:#fff;color:#050505;font-weight:750;font-size:15px;cursor:pointer}button.secondary{background:#181818;color:#fff;border:1px solid #333}button:disabled{opacity:.45}.status{min-height:22px;margin:14px 2px 0;color:#aaa;font-size:13px;white-space:pre-line}.progress{height:6px;background:#1d1d1d;border-radius:99px;overflow:hidden;margin-top:10px;display:none}.progress>i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .35s ease}.progress.on{display:block}.result{margin-top:16px}.result video{width:100%;border-radius:14px;background:#000;max-height:70vh}.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}.pill{font-size:11px;color:#aaa;border:1px solid #292929;border-radius:99px;padding:5px 8px}.link{color:#bbb;text-decoration:none;font-size:12px}.cfg{margin-top:10px;color:#777;font-size:12px}.ok{color:#a8e6b0}.warn{color:#e8c486}
</style></head><body><main><div class="brand">DIZA IMAGINE <span class="pill">HUNYUAN 1.5 · STEP-DISTILLED · 5s</span></div><div class="panel">
<label class="drop" id="drop"><span id="hint"><b>Upload image</b><br><span class="muted">JPG / PNG / WEBP</span></span><img id="preview" hidden></label><input id="file" type="file" accept="image/*" hidden>
<textarea id="prompt" placeholder="Describe the motion..."></textarea>
<input id="backendUrl" type="password" autocomplete="off" placeholder="Kaggle backend URL">
<div class="row"><span class="muted">Backend Kaggle aktif.</span></div>
<div class="cfg"><b>BUILD KAGGLE-v8</b> · 121 frames · 24 fps · raw prompt</div>
<div class="status" id="backend">Backend: https://d84269933dc99cf25d.gradio.live</div>
<button id="go">Generate real 5s video</button><div class="progress" id="progress"><i id="bar"></i></div><div class="status" id="status"></div><div class="result" id="result"></div>
</div></main><script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
const BUILD="KAGGLE-v8",TARGET_FRAMES=121,DEFAULT_BACKEND="https://d84269933dc99cf25d.gradio.live";
const file=document.querySelector('#file'),drop=document.querySelector('#drop'),preview=document.querySelector('#preview'),hint=document.querySelector('#hint'),go=document.querySelector('#go'),status=document.querySelector('#status'),backendEl=document.querySelector('#backend'),result=document.querySelector('#result'),progress=document.querySelector('#progress'),bar=document.querySelector('#bar'),backendUrl=document.querySelector('#backendUrl');
sessionStorage.removeItem('diza_kaggle_backend');backendUrl.value=DEFAULT_BACKEND;
const prog=(n,t)=>{progress.classList.add('on');bar.style.width=Math.max(0,Math.min(100,n))+'%';status.textContent=n+'% · '+t};
drop.onclick=()=>file.click();file.onchange=()=>{if(!file.files[0])return;preview.src=URL.createObjectURL(file.files[0]);preview.hidden=false;hint.hidden=true};
go.onclick=async()=>{const p=document.querySelector('#prompt').value.trim(),backend=(backendUrl.value.trim()||DEFAULT_BACKEND).replace(/\/$/,'');if(!file.files[0]||!p){status.textContent='Upload image dan isi prompt dulu.';return}sessionStorage.setItem('diza_kaggle_backend',backend);backendEl.textContent='Backend: '+backend;go.disabled=true;result.innerHTML='';prog(5,BUILD+' · connecting Kaggle');try{if(!backend.includes('d84269933dc99cf25d.gradio.live'))throw Error('BLOCKED_OLD_BACKEND');const app=await Client.connect(DEFAULT_BACKEND);prog(18,'Sending raw prompt · 121 frames');const job=app.submit('/generate',{input_image:handle_file(file.files[0]),prompt:p,seed:-1});let data=null;for await(const msg of job){if(msg.type==='status'){const q=msg.position!=null?' · queue '+(msg.position+1):'';prog(35,'Kaggle Hunyuan generating'+q)}else if(msg.type==='data'){data=msg.data;prog(92,'Encoding MP4…');break}}if(!data)throw Error('Backend returned no result');let v=null;const walk=o=>{if(v)return;if(typeof o==='string'&&/\.(mp4|webm)(\?|$)/i.test(o))v=o;else if(o&&typeof o==='object'){if(o.url&&/\.(mp4|webm)(\?|$)/i.test(o.url))v=o.url;else Object.values(o).forEach(walk)}};walk(data);if(!v)throw Error('No MP4 URL returned');result.innerHTML='<video id="vid" controls autoplay loop playsinline src="'+v+'"></video><div class="row"><span class="muted" id="meta">Checking duration…</span><a class="pill" style="color:#fff;text-decoration:none" target="_blank" href="'+v+'">Open MP4</a></div>';const vid=document.querySelector('#vid'),meta=document.querySelector('#meta');await new Promise((resolve,reject)=>{vid.onloadedmetadata=resolve;vid.onerror=()=>reject(Error('Video metadata failed'))});const d=vid.duration;meta.textContent=TARGET_FRAMES+' frames · '+d.toFixed(2)+'s actual';if(!Number.isFinite(d)||d<4.5)throw Error('WRONG_DURATION '+d.toFixed(2)+'s');prog(100,'REAL '+d.toFixed(2)+' detik ✓')}catch(e){status.textContent='Generation failed: '+String(e.message||e).slice(0,520)}finally{go.disabled=false}};
</script></body></html>
