<!doctype html><html><head>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Diza Imagine</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px 60px}.brand{font-weight:750;font-size:20px;letter-spacing:-.4px;margin-bottom:28px}.panel{border:1px solid #242424;background:#0d0d0d;border-radius:18px;padding:16px}.drop{height:290px;border:1px dashed #383838;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:#111;cursor:pointer}.drop img{width:100%;height:100%;object-fit:contain}.muted{color:#888;font-size:13px}textarea,input[type=password]{width:100%;margin-top:14px;background:#111;border:1px solid #2b2b2b;border-radius:14px;color:#fff;padding:14px;font:inherit;outline:none}textarea{min-height:120px;resize:vertical}button{width:100%;height:52px;border:0;border-radius:14px;margin-top:12px;background:#fff;color:#050505;font-weight:750;font-size:15px;cursor:pointer}button:disabled{opacity:.45}.status{min-height:22px;margin:14px 2px 0;color:#aaa;font-size:13px;white-space:pre-line}.progress{height:6px;background:#1d1d1d;border-radius:99px;overflow:hidden;margin-top:10px;display:none}.progress>i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .35s ease}.progress.on{display:block}.result{margin-top:16px}.result video{width:100%;border-radius:14px;background:#000;max-height:70vh}.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}.pill{font-size:11px;color:#aaa;border:1px solid #292929;border-radius:99px;padding:5px 8px}.link{color:#bbb;text-decoration:none;font-size:12px}.cfg{margin-top:10px;color:#777;font-size:12px}
</style></head><body><main><div class="brand">DIZA IMAGINE <span class="pill">HUNYUAN 1.5 · I2V · ~5s</span></div><div class="panel">
<label class="drop" id="drop"><span id="hint"><b>Upload image</b><br><span class="muted">JPG / PNG / WEBP</span></span><img id="preview" hidden></label><input id="file" type="file" accept="image/*" hidden>
<textarea id="prompt" placeholder="Describe the motion..."></textarea>
<input id="token" type="password" autocomplete="off" placeholder="HF token (gratis, untuk quota ZeroGPU)">
<div class="row"><span class="muted">Token hanya dipakai browser ini untuk request ke Hugging Face.</span><a class="link" target="_blank" rel="noopener" href="https://huggingface.co/settings/tokens">Buat token HF ↗</a></div>
<div class="cfg"><b>BUILD 121F-v4</b> · 480p · 121 frames · 24 fps · 4 steps · prompt rewrite OFF</div>
<button id="go">Generate 5s video</button><div class="progress" id="progress"><i id="bar"></i></div><div class="status" id="status"></div><div class="result" id="result"></div>
</div></main><script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
const LENGTH=121, STEPS=4, SHIFT=5, GUIDANCE=1, BUILD="121F-v4";
const file=document.querySelector('#file'),drop=document.querySelector('#drop'),preview=document.querySelector('#preview'),hint=document.querySelector('#hint'),go=document.querySelector('#go'),token=document.querySelector('#token'),status=document.querySelector('#status'),result=document.querySelector('#result'),progress=document.querySelector('#progress'),bar=document.querySelector('#bar');
token.value=sessionStorage.getItem('hf_token')||'';
const prog=(n,t)=>{progress.classList.add('on');bar.style.width=Math.max(0,Math.min(100,n))+'%';status.textContent=n+'% · '+t};
drop.onclick=()=>file.click();file.onchange=()=>{if(!file.files[0])return;preview.src=URL.createObjectURL(file.files[0]);preview.hidden=false;hint.hidden=true};
go.onclick=async()=>{const p=document.querySelector('#prompt').value.trim(),hf=token.value.trim();if(!file.files[0]||!p){status.textContent='Upload image dan isi prompt dulu.';return}if(!hf){status.textContent='Masukkan HF token gratis dulu.';return}sessionStorage.setItem('hf_token',hf);go.disabled=true;result.innerHTML='';prog(5,BUILD+' · preparing 121 frames');
try{
  const app=await Client.connect("multimodalart/Hunyuan-Video-1-5",{token:hf});
  prog(18,'Authenticated ZeroGPU · sending LENGTH='+LENGTH);
  const job=app.submit(0,[handle_file(file.files[0]),p,LENGTH,STEPS,SHIFT,-1,GUIDANCE,false]);
  let r=null;
  for await(const msg of job){
    if(msg.type==='status'){const q=msg.position!=null?' · queue '+(msg.position+1):'';prog(38,'Generating '+LENGTH+' frames'+q)}
    else if(msg.type==='data'){prog(92,'Encoding MP4…');r={data:msg.data};break}
  }
  if(!r)throw Error('Hunyuan returned no result');
  let v=null;const walk=o=>{if(v)return;if(typeof o==='string'&&/\.(mp4|webm)(\?|$)/i.test(o))v=o;else if(o&&typeof o==='object'){if(o.url&&/\.(mp4|webm)(\?|$)/i.test(o.url))v=o.url;else Object.values(o).forEach(walk)}};walk(r.data);
  if(!v)throw Error('No MP4 URL returned');
  result.innerHTML='<video id="vid" controls autoplay loop playsinline src="'+v+'"></video><div class="row"><span class="muted" id="meta">Checking duration…</span><a class="pill" style="color:#fff;text-decoration:none" target="_blank" href="'+v+'">Open MP4</a></div>';
  const vid=document.querySelector('#vid'),meta=document.querySelector('#meta');
  await new Promise((resolve,reject)=>{vid.onloadedmetadata=resolve;vid.onerror=()=>reject(Error('Video metadata failed'))});
  const d=vid.duration;
  meta.textContent=LENGTH+' frames · '+d.toFixed(2)+'s actual';
  if(!Number.isFinite(d)||d<4.5) throw Error('WRONG_DURATION '+d.toFixed(2)+'s · expected ~5s');
  prog(100,'Video '+d.toFixed(2)+' detik selesai ✓');
}catch(e){
  const m=String(e.message||e);
  if(/WRONG_DURATION/.test(m)) status.textContent='FAILED DURATION: '+m+'\nBuild aktif: '+BUILD+' · request LENGTH='+LENGTH;
  else if(/quota|ZeroGPU/i.test(m)) status.textContent='Quota ZeroGPU belum cukup untuk job 121 frame.';
  else status.textContent='Generation failed: '+m.slice(0,360);
}finally{go.disabled=false;if(!result.innerHTML)setTimeout(()=>progress.classList.remove('on'),1500)}};
</script></body></html>
