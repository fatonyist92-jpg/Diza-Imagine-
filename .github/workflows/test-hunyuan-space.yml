name: Test Hunyuan Public Space

on:
  push:
    paths:
      - ".github/workflows/test-hunyuan-space.yml"
  workflow_dispatch:

jobs:
  api-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install "gradio_client==2.7.1" pillow imageio-ffmpeg

      - name: Generate small Hunyuan smoke-test video
        run: |
          python - <<'PY'
          from PIL import Image
          from gradio_client import Client, handle_file
          import os

          prompt = "A red ball rolls slowly from left to right."
          Image.new("RGB", (854, 480), (32, 32, 32)).save("hunyuan_test.png")

          client = Client("multimodalart/Hunyuan-Video-1-5")
          result = client.predict(
              handle_file("hunyuan_test.png"),
              prompt,
              121,
              6,
              5.0,
              12345,
              1.0,
              False,
              api_name="/generate",
          )

          video = result[0]["path"] if isinstance(result[0], dict) else result[0]
          actual_prompt = result[1]
          print("ACTUAL_PROMPT:", actual_prompt)
          print("VIDEO_PATH:", video)
          assert actual_prompt == prompt, "Prompt was modified"
          assert os.path.exists(video), "Video file missing"
          os.replace(video, "hunyuan_smoke.mp4")
          PY

      - name: Verify MP4
        run: |
          python - <<'PY'
          import imageio_ffmpeg
          n, sec = imageio_ffmpeg.count_frames_and_secs("hunyuan_smoke.mp4")
          print(f"frames={n} duration={sec:.3f}s")
          assert n >= 121
          assert sec >= 4.5
          PY

      - name: Upload smoke-test MP4
        uses: actions/upload-artifact@v4
        with:
          name: hunyuan-121f-mp4
          path: hunyuan_smoke.mp4
