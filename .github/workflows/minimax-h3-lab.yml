name: MiniMax H3 10s Lab
on:
  push:
    branches: [minimax-h3-lab]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q gradio_client requests
      - run: |
          python - <<'PY'
          import requests
          from gradio_client import Client
          base='https://minimaxai-minimax-h3-turbo-lora.hf.space'
          for p in ['/gradio_api/info','/config']:
              r=requests.get(base+p,timeout=30); print(p,r.status_code,r.text[:20000])
          c=Client("MiniMaxAI/MiniMax-H3-Turbo-Lora")
          c.view_api()
          PY
