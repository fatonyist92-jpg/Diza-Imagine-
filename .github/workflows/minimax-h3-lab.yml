name: MiniMax H3 10s Lab
on:
  push:
    branches: [minimax-h3-lab]
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q gradio_client requests
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate and package 10s MP4
        run: |
          python - <<'PY'
          import requests, shutil, os, time
          from gradio_client import Client, handle_file
          img='first.png'
          r=requests.get('https://huggingface.co/spaces/MiniMaxAI/MiniMax-H3-Turbo-Lora/resolve/main/examples/first.png',timeout=60)
          r.raise_for_status()
          open(img,'wb').write(r.content)
          c=Client("MiniMaxAI/MiniMax-H3-Turbo-Lora")
          for attempt in range(1,4):
              try:
                  res=c.predict(
                      "The fox looks around, then trots deeper into the forest",
                      handle_file(img), None, "544x544 · 1:1 fast",
                      5, 2, 42, False, "larry",
                      api_name="/output_video"
                  )
                  break
              except Exception as e:
                  print("ATTEMPT_ERROR",attempt,repr(e),flush=True)
                  if attempt==3: raise
                  time.sleep(45)
          print("H3_RESULT",res,flush=True)
          p=res[0]
          if isinstance(p,dict): p=p.get('path') or p.get('video') or p.get('url')
          shutil.copyfile(p,'clip.mp4')
          PY
          ffmpeg -y -stream_loop 1 -i clip.mp4 -t 10 -c:v libx264 -preset ultrafast -c:a aac minimax-h3-10s.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 minimax-h3-10s.mp4
          test $(stat -c%s minimax-h3-10s.mp4) -gt 10000
      - uses: actions/upload-artifact@v4
        with:
          name: minimax-h3-10s-mp4
          path: minimax-h3-10s.mp4
          if-no-files-found: error
