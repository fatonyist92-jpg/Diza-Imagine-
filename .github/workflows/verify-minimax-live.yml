name: Verify MiniMax Live Web E2E
on:
  push:
    branches: [main]
  workflow_dispatch:\n  pull_request:\n    branches: [main]
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q playwright
      - run: playwright install --with-deps chromium
      - name: Generate video through live web
        run: python minimax_web/e2e_live.py
