            "Lake-Phrost/tencent-HunyuanVideo-1.5",
            "ChaosWithme/tencent-HunyuanVideo-1.5",
            "hiadarf/tencent-HunyuanVideo-1.5",
            "rk000000007/tencent-HunyuanVideo-1.5",
            "CranberryKnight/tencent-HunyuanVideo-1.5",
            "LUGUOZZZ/tencent-HunyuanVideo-1.5",
            "toleutajdani/tencent-HunyuanVideo-1.5",
            "Laurexp/tencent-HunyuanVideo-1.5",
            "Mezzolee/tencent-HunyuanVideo-1.5",
            "mayankrawat98/tencent-HunyuanVideo-1.5",
            "sandy018/tencent-HunyuanVideo-1.5",
