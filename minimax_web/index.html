<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIZA Imagine · MiniMax H3</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 56px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:800;letter-spacing:-.04em;font-size:23px}.engine{font-size:12px;color:#aaa;border:1px solid #2b2b2b;padding:7px 10px;border-radius:999px}.card{border:1px solid #222;background:#0b0b0b;border-radius:18px;padding:14px;margin-bottom:12px}.drop{min-height:270px;border:1px dashed #353535;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:#080808;cursor:pointer}.drop img{width:100%;height:100%;max-height:440px;object-fit:contain}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.hint{text-align:center;color:#999}.hint b{color:#eee}textarea{width:100%;min-height:120px;resize:vertical;background:#080808;border:1px solid #292929;border-radius:14px;color:#fff;padding:14px;font:inherit;outline:none}.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.pill{border:1px solid #303030;background:#111;color:#ddd;padding:9px 12px;border-radius:999px;font-size:13px}.pill.on{background:#eee;color:#050505;border-color:#eee}button{width:100%;margin-top:12px;border:0;border-radius:14px;padding:15px;background:#f2f2f2;color:#050505;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.45}.progress{height:4px;background:#202020;border-radius:99px;overflow:hidden;margin-top:13px;display:none}.bar{height:100%;width:0;background:#eee;transition:width .5s}.status{color:#aaa;font-size:13px;margin-top:9px;min-height:18px}.result{display:none}.result video{width:100%;border-radius:14px;background:#000}.download{display:block;text-align:center;background:#f2f2f2;color:#050505;text-decoration:none;font-weight:800;padding:14px;border-radius:14px;margin-top:10px}.note{font-size:12px;color:#777;margin-top:9px;line-height:1.5}</style></head><body><main class="wrap"><div class="top"><div class="brand">DIZA Imagine</div><div class="engine">MiniMax H3 Turbo</div></div><div class="card"><label class="drop"><div class="hint" id="hint"><b>Upload image</b><br>Tap untuk pilih foto</div><img id="preview" style="display:none"><input id="image" type="file" accept="image/*"></label></div><div class="card"><textarea id="prompt" placeholder="Describe the motion..."></textarea><div class="row"><span class="pill on">1:1 · 544p</span><span class="pill on">10 sec</span><span class="pill">4 steps</span></div><div class="note">Prompt dikirim persis seperti yang kamu ketik. Prompt upsampling OFF.</div><button id="go">GENERATE VIDEO</button><div class="progress" id="prog"><div class="bar" id="bar"></div></div><div class="status" id="status"></div></div><div class="card result" id="result"><video id="video" controls playsinline loop></video><a class="download" id="download" download="DIZA-MiniMax-H3-10s.mp4">DOWNLOAD MP4</a></div></main>
<script>
const BASE="https://minimaxai-minimax-h3-turbo-lora.hf.space";const $=id=>document.getElementById(id),image=$("image"),preview=$("preview"),hint=$("hint"),go=$("go"),status=$("status"),prog=$("prog"),bar=$("bar"),result=$("result"),video=$("video"),download=$("download");let timer,pct=0,lastUrl;
image.onchange=()=>{const f=image.files[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.style.display="block";hint.style.display="none"};
async function squareBlob(file){const bmp=await createImageBitmap(file),s=Math.min(bmp.width,bmp.height),c=document.createElement("canvas");c.width=c.height=544;const x=(bmp.width-s)/2,y=(bmp.height-s)/2;c.getContext("2d").drawImage(bmp,x,y,s,s,0,0,544,544);return await new Promise(r=>c.toBlob(r,"image/jpeg",.95))}
async function upload(blob){const fd=new FormData();fd.append("files",blob,"input_544.jpg");const r=await fetch(BASE+"/gradio_api/upload",{method:"POST",body:fd});if(!r.ok)throw new Error("Upload MiniMax gagal "+r.status);const a=await r.json();return a[0]}
async function generate(path,prompt){const fileData={path,orig_name:"input_544.jpg",mime_type:"image/jpeg",meta:{_type:"gradio.FileData"}};const payload={data:[prompt,fileData,null,"544x544 · 1:1 fast",10,4,42,false,"larry"]};const s=await fetch(BASE+"/gradio_api/call/output_video",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!s.ok)throw new Error("Queue MiniMax gagal "+s.status);const j=await s.json();if(!j.event_id)throw new Error("MiniMax tidak mengembalikan event id");const r=await fetch(BASE+"/gradio_api/call/output_video/"+j.event_id);const txt=await r.text();const lines=txt.split("\n");const i=lines.findIndex(x=>x.trim()==="event: complete");const d=i>=0?lines.slice(i+1).find(x=>x.startsWith("data: ")):null;if(!d){const er=lines.find(x=>x.startsWith("data: "));throw new Error("MiniMax gagal: "+(er?er.slice(6):"no result"))}return JSON.parse(d.slice(6))}
go.onclick=async()=>{const f=image.files[0],p=$("prompt").value;if(!f||!p.trim()){status.textContent="Image dan prompt wajib diisi.";return}go.disabled=true;result.style.display="none";prog.style.display="block";pct=5;bar.style.width="5%";status.textContent="Preparing image…";timer=setInterval(()=>{pct=Math.min(92,pct+(pct<35?4:pct<70?2:1));bar.style.width=pct+"%";status.textContent=pct<25?"Uploading image…":pct<45?"Masuk antrean MiniMax H3…":pct<90?"MiniMax H3 sedang membuat video…":"Finishing MP4…"},1200);try{const b=await squareBlob(f),path=await upload(b),out=await generate(path,p);const v=out[0];const remote=(v&&v.url)|| (v&&v.path?BASE+"/gradio_api/file="+encodeURIComponent(v.path):null);if(!remote)throw new Error("MP4 tidak ditemukan");const rr=await fetch(remote);if(!rr.ok)throw new Error("MP4 selesai tapi tidak bisa diambil");const vb=await rr.blob();if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(vb);video.src=lastUrl;download.href=lastUrl;result.style.display="block";bar.style.width="100%";status.textContent="Video selesai ✓";video.play().catch(()=>{})}catch(e){status.textContent=e.message||"Generate gagal";bar.style.width="0%"}finally{clearInterval(timer);go.disabled=false}};
if(new URLSearchParams(location.search).get("selftest")==="1"){(async()=>{try{status.textContent="Self-test preparing…";const r=await fetch("https://raw.githubusercontent.com/gradio-app/gradio/main/test/test_files/bus.png");const b=await r.blob();const file=new File([b],"bus.png",{type:b.type||"image/png"});const dt=new DataTransfer();dt.items.add(file);image.files=dt.files;image.onchange();$("prompt").value="The bus moves slowly forward while the camera remains stationary.";setTimeout(()=>go.click(),500)}catch(e){status.textContent="Self-test setup failed: "+e.message}})()}
</script></body></html>
